import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'com.google.devtools.ksp'
    id 'androidx.room'
}

android {
    namespace 'github.luthfipun.ck_downloader_core'
    compileSdk = 37

    defaultConfig {
        minSdk = 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = JvmTarget.JVM_17
        }
    }
    publishing {
        singleVariant("release") {
            // Optional: Include sources and Javadoc if needed
            withSourcesJar()
            withJavadocJar()
        }
    }
}

room {
    schemaDirectory("$projectDir/schemas")
}

dependencies {

    // Exposed in the public API (CkDownloadService, CkDownloadNotificationHelper, Flow return types)
    api 'androidx.core:core-ktx:1.19.1'
    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    def okHttpVersion = "4.10.0"
    api(platform("com.squareup.okhttp3:okhttp-bom:$okHttpVersion"))
    api "com.squareup.okhttp3:okhttp"

    def roomVersion = "2.8.5"
    implementation "androidx.room:room-runtime:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.squareup.okhttp3:mockwebserver"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'github.luthfipun'
                artifactId = 'ck_downloader_core'
                version = '0.5'
            }
        }
    }
}